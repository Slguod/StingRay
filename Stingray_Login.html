<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stingray Login</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="Signin.js" defer></script>
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <img src="images/stingraylogo.png" alt="Stingray Logo" />
        <h1>Stingray</h1>
      </div>
      <form>
        <label for="user-id">User ID:</label>
        <div class="input-group">
          <input type="email" placeholder="Email" id="email" required>
          <span class="icon">⌨️</span>
        </div>

        <label for="password">Password:</label>
        <div class="input-group">
          <input type="password" placeholder="password" id="password" required>
          <span class="icon">⌨️</span>
        </div>

        <a href="#" class="forgot-password">Forgot Password?</a>

        <button id="submit" type="submit" class="login-btn">Log In</button>

        <button id="submit" type="button" class="create-account-btn">Create Account</button>
      </form>
    </div>
  </div>
</body>

</html>
