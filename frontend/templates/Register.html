<!DOCTYPE html>
<html lang="en">

<head>
    <title>Register Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">



    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script type="module" src="{{ url_for('static', filename='firebase-init.js') }}" defer></script>
    <script type="module" src="{{ url_for('static', filename='register.js') }}" defer></script>
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <img src="{{ url_for('static', filename='images/stingraylogo.png') }}" alt="Stingray Logo" />
        <h1>Stingray</h1>
      </div>
    <form>
        <h1>Create An Account</h1>
        <label for="full-name">Full Name:</label>
        <div class="input-group">
            <input type="text" placeholder="Full Name" id="full-name" required>
            <span class="icon">👤</span>
        </div>

        <label for="email">Email:</label>
        <div class="input-group">
            <input type="email" placeholder="Email" id="email" required>
            <span class="icon">✉️</span>
        </div>

        <label for="phone-number">Phone Number:</label>
        <div class="input-group">
            <input type="tel" placeholder="Phone Number" id="phone-number" required>
            <span class="icon">📞</span>
        </div>

        <label for="password">Password:</label>
        <div class="input-group">
            <input type="password" placeholder="Password" id="password" required>
            <span class="icon">🔒</span>
        </div>

        <label for="confirm-password">Confirm Password:</label>
        <div class="input-group">
            <input type="password" placeholder="Confirm Password" id="confirm-password" required>
            <span class="icon">🔒</span>
        </div>

        <button id="register-btn" type="submit">Create Account</button>
        <div class="form">
            <p>Have an account?
                <span>
                    <a href="/login">Login Here</a>
                </span>
            </p>
        </div>
    </form>
</body>

</html>
