<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stingray Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
<script type="module" src="{{ url_for('static', filename='firebase-init.js') }}" defer></script>
    <script type="module" src="{{ url_for('static', filename='Signin.js') }}" defer></script>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/stingraylogo.png') }}" alt="Stingray Logo" />
                <h1>Stingray</h1>
            </div>
            <form>
                <label for="user-id">Email:</label>
                <div class="input-group">
                    <input type="email" placeholder="Email" id="email" required>
                    <span class="icon">⌨️</span>
                </div>
                <label for="password">Password:</label>
                <div class="input-group">
                    <input type="password" placeholder="password" id="password" required>
                    <span class="icon">⌨️</span>
                </div>

                <a href="#" class="forgot-password">Forgot Password?</a>

                <button id="login-btn" type="submit" class="login-btn">Log In</button>

                <a href="/register" class="create-account-btn">Create Account</a>
            </form>
        </div>
    </div>
</body>

</html>
