<script type="module" src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await fetchAndPopulateUsers();
        await fetchAndDisplayCalendar();
        
        const userSelect = document.getElementById('userSelect');
        if (userSelect) {
            userSelect.addEventListener('change', fetchAndDisplayCalendar);
        }
    });

    async function fetchAndPopulateUsers() {
        const userSelect = document.getElementById('userSelect');
        if (!userSelect) return;

        try {
            const response = await fetch('/api/users');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const users = await response.json();
            
            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                userSelect.appendChild(option);
            });

        } catch (error) {
            console.error('Error fetching user list:', error);
        }
    }

    async function fetchAndDisplayCalendar() {
    // URL of our new backend endpoint
    const url = '/api/calendar_activity';

    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const activeDates = await response.json();
        
        // We'll use a Set for fast lookups
        const activeDatesSet = new Set(activeDates);
        
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();

        const calendarGrid = document.getElementById('calendar-grid');
        if (!calendarGrid) return;
        calendarGrid.innerHTML = ''; // Clear existing days

        // Add day headers
        const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        daysOfWeek.forEach(day => {
            const dayHeader = document.createElement('div');
            dayHeader.classList.add('calendar-day-header');
            dayHeader.textContent = day;
            calendarGrid.appendChild(dayHeader);
        });

        const firstDayOfMonth = new Date(year, month, 1).getDay();
        for (let i = 0; i < firstDayOfMonth; i++) {
            const emptyDiv = document.createElement('div');
            calendarGrid.appendChild(emptyDiv);
        }

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) {
            const dayDiv = document.createElement('div');
            dayDiv.classList.add('calendar-day');
            dayDiv.textContent = day;

            // Format the current day to 'YYYY-MM-DD' to match the backend format
            const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            // Check if this date has an incident
            if (activeDatesSet.has(formattedDate)) {
                dayDiv.classList.add('active-day');
            }

            calendarGrid.appendChild(dayDiv);
        }

    } catch (error) {
        console.error('Error fetching calendar activity:', error);
    }
}
</script>
